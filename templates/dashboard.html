<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
</head>
<body>
<h2>Welcome, {{ user.name }}</h2>
<form action="/submit_scores" method="POST">
  <label>DSA:</label><input type="number" name="dsa" required><br>
  <label>DBMS:</label><input type="number" name="dbms" required><br>
  <label>OS:</label><input type="number" name="os" required><br>
  <label>CN:</label><input type="number" name="cn" required><br>
  <label>Math:</label><input type="number" name="math" required><br>
  <label>Aptitude:</label><input type="number" name="aptitude" required><br>
  <label>Communication:</label><input type="number" name="comm" required><br>
  <label>Problem Solving:</label><input type="number" name="problem_solving" required><br>
  <label>Creative:</label><input type="number" name="creative" required><br>
  <label>Hackathons:</label><input type="number" name="hackathons" required><br>
  <button type="submit">Submit & Get Recommendations</button>
</form>
</body>
</html>

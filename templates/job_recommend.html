<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Job Recommendations</title>
</head>
<body>
    <h1>Hello, {{ user.name }} 👋</h1>
    <h2>Top Job Recommendations:</h2>

        <li>{{ job }}</li>
        {% endfor %}
    </ul>
    <a href="{{ url_for('home') }}">Back to Home</a>
</body>
</html>
